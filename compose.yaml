services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_DATABASE:-icd}
      POSTGRES_USER: ${DB_USERNAME:-icd}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-icd}
    ports:
      - "${DB_FORWARD_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: docker/app
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "composer install --no-interaction
      && (grep -q '^APP_KEY=.' .env || php artisan key:generate --force)
      && php artisan migrate --force
      && php artisan serve --host=0.0.0.0 --port=8000"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 300s

volumes:
  pgdata:
